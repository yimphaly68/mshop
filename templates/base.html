<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Stock Control{% endblock %} · MyM Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar sticky-top">
  <div class="container-fluid px-3">
    <a class="navbar-brand fw-semibold" href="{{ url_for('dashboard') }}">
      <i class="bi bi-bag-heart-fill me-2"></i>MyM Shop Stock
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint=='dashboard' }}" href="{{ url_for('dashboard') }}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint in ['items_list','item_new','item_edit'] }}" href="{{ url_for('items_list') }}"><i class="bi bi-box-seam me-1"></i>Items</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint=='sales_list' }}" href="{{ url_for('sales_list') }}"><i class="bi bi-cart-check me-1"></i>Sales</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint=='advertising_list' }}" href="{{ url_for('advertising_list') }}"><i class="bi bi-megaphone me-1"></i>Advertising</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.endpoint=='reports' }}" href="{{ url_for('reports') }}"><i class="bi bi-graph-up-arrow me-1"></i>Reports</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
